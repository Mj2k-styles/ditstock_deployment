# Cluster kind du pipeline CD : un nœud ; le NodePort 30080 du frontend est publié
# sur le port 8080 de la machine qui exécute le pipeline.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
