# Adresse interne de la base : db:5432 (non exposée hors du cluster).
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: ditstock
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: ditstock
spec:
  selector:
    app.kubernetes.io/name: database
  ports:
    - port: 5432
      targetPort: 5432
