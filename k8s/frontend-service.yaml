# Point d'entrée de l'application : NodePort 30080 sur chaque nœud du cluster.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ditstock
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ditstock
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
